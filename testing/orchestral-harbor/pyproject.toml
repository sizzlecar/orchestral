[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "orchestral-harbor"
version = "0.1.0"
description = "Harbor adapter for the native Orchestral CLI"
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0", "PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestral_harbor"]

