[package]
name = "orchestral-examples"
version = "0.1.0"
edition = "2021"
publish = false
autoexamples = false

[[example]]
name = "agent_session"
path = "agent_session.rs"

[dependencies]
orchestral-core = { path = "../core/orchestral-core" }
orchestral-runtime = { path = "../core/orchestral-runtime" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-util = "0.7"
