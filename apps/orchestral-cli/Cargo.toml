[package]
name = "orchestral-cli"
autobins = false
description = "Provider-neutral conversational Agent command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "orchestral"
path = "src/main.rs"

[dependencies]
orchestral-core = { workspace = true }
orchestral-runtime = { workspace = true }
orchestral-agent-journal-fs = { path = "../../plugins/orchestral-agent-journal-fs" }
orchestral-blob-fs = { path = "../../plugins/orchestral-blob-fs" }
orchestral-model-gemini = { workspace = true }
orchestral-model-openai = { workspace = true }
orchestral-mcp-streamable-http = { path = "../../plugins/orchestral-mcp-streamable-http" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48.0"
portable-pty = "0.9"
