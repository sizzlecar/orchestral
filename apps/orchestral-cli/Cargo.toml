[package]
name = "orchestral-cli"
autobins = false
description = "Provider-neutral conversational Agent command line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "orchestral"
path = "src/main.rs"

[dependencies]
orchestral-core = { workspace = true }
orchestral-runtime = { workspace = true }
orchestral-agent-codex = { workspace = true }
orchestral-agent-journal-fs = { path = "../../plugins/orchestral-agent-journal-fs" }
orchestral-artifact-r2 = { workspace = true }
orchestral-blob-fs = { path = "../../plugins/orchestral-blob-fs" }
orchestral-model-gemini = { workspace = true }
orchestral-model-openai = { workspace = true }
orchestral-mcp-streamable-http = { path = "../../plugins/orchestral-mcp-streamable-http" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
async-trait = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
async-stream = "0.3"
qrcode = { version = "0.14", default-features = false }
include_dir = "0.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
unicode-width = "0.2"
reqwest = { workspace = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
async-trait = { workspace = true }
insta = "1.48.0"
portable-pty = "0.9"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
orchestral-agent-protocol-testkit = { path = "../../testing/orchestral-agent-protocol-testkit" }
