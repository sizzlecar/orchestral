[workspace]
resolver = "2"
members = [
    # Core (Tier 1 - publishable as lib, no platform dependencies)
    "core/orchestral-core",
    "core/orchestral-runtime",
    "core/orchestral",

    # Concrete infrastructure plugins
    "plugins/orchestral-agent-journal-fs",
    "plugins/orchestral-blob-fs",
    "plugins/orchestral-model-gemini",
    "plugins/orchestral-model-openai",

    # Apps
    "apps/orchestral-cli",
    # Examples
    "examples",

    # Protocol conformance (external-consumer boundary)
    "testing/orchestral-agent-protocol-testkit",
    "testing/orchestral-model-protocol-testkit",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sizzlecar/orchestral"
homepage = "https://github.com/sizzlecar/orchestral"
keywords = ["orchestration", "agent", "workflow", "llm", "dag"]
categories = ["asynchronous", "command-line-utilities"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
serde_jcs = "0.2"

# Internal crates - Core
orchestral = { path = "core/orchestral" }
orchestral-core = { path = "core/orchestral-core", version = "0.2.0" }
orchestral-runtime = { path = "core/orchestral-runtime", version = "0.2.0" }
orchestral-model-gemini = { path = "plugins/orchestral-model-gemini", version = "0.2.0" }
orchestral-model-openai = { path = "plugins/orchestral-model-openai", version = "0.2.0" }
orchestral-model-protocol-testkit = { path = "testing/orchestral-model-protocol-testkit" }

[workspace.dependencies.tokio-test]
version = "0.4"
