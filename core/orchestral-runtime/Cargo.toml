[package]
name = "orchestral-runtime"
description = "Provider-neutral Agent control plane, Generic Agent, durable context, and guarded Tool runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
orchestral-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
shell-words = { workspace = true }
globset = { workspace = true }
grep-matcher = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
cap-std = "4.0.2"
portable-pty = "0.9"
strip-ansi-escapes = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = { workspace = true }
orchestral-agent-protocol-testkit = { path = "../../testing/orchestral-agent-protocol-testkit" }
orchestral-mcp-streamable-http = { path = "../../plugins/orchestral-mcp-streamable-http" }
