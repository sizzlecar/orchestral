<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111318" />
    <meta
      name="description"
      content="Orchestral 是一个专注、可安装、支持离线启动的智能任务工作台。"
    />
    <meta name="application-name" content="Orchestral" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orchestral" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>Orchestral</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">跳到对话</a>

    <div
      id="splash"
      class="launch-screen"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <img class="launch-screen__mark" src="./icons/icon-192.svg" alt="" width="72" height="72" />
      <p class="launch-screen__name">Orchestral</p>
      <p class="launch-screen__status">正在准备工作台</p>
    </div>

    <div id="app-shell" class="app-shell" data-state="starting">
      <header class="mobile-topbar">
        <button
          id="mobile-sidebar-toggle"
          class="icon-button"
          type="button"
          aria-label="打开会话列表"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21">
            <path d="M4 7h16M4 12h16M4 17h11" />
          </svg>
        </button>

        <a class="mobile-brand" href="./" aria-label="Orchestral 首页">
          <img src="./icons/favicon.svg" alt="" width="28" height="28" />
          <span>Orchestral</span>
        </a>

        <button
          class="icon-button"
          type="button"
          aria-label="新建会话"
          data-action="new-thread"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </header>

      <div class="app-layout">
        <button
          id="sidebar-backdrop"
          class="sidebar-backdrop"
          type="button"
          aria-label="关闭会话列表"
          hidden
        ></button>

        <aside id="sidebar" class="sidebar" aria-label="会话导航">
          <div class="sidebar__head">
            <a class="brand" href="./" aria-label="Orchestral 首页">
              <img src="./icons/favicon.svg" alt="" width="34" height="34" />
              <span class="brand__copy">
                <strong>Orchestral</strong>
                <span>agent workspace</span>
              </span>
            </a>

            <button
              id="new-thread-button"
              class="new-thread-button"
              type="button"
              aria-label="新建会话"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>新建会话</span>
              <kbd aria-hidden="true">⌘ K</kbd>
            </button>
          </div>

          <nav class="thread-nav" aria-label="最近会话">
            <div class="section-label">
              <span>最近</span>
              <span id="thread-count" class="section-label__count" aria-hidden="true"></span>
            </div>
            <ul id="thread-list" class="thread-list" aria-live="polite"></ul>
            <p id="thread-list-empty" class="thread-list-empty">还没有会话。开始一个新任务吧。</p>
          </nav>

          <footer class="sidebar__footer">
            <button id="install-button" class="sidebar-action" type="button" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" />
              </svg>
              <span>安装到设备</span>
            </button>

            <button id="settings-button" class="sidebar-action" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
              </svg>
              <span>设置</span>
            </button>

            <div id="connection-status" class="connection-status" role="status" aria-live="polite">
              <span class="connection-status__dot" aria-hidden="true"></span>
              <span class="connection-status__label">正在连接</span>
            </div>
          </footer>
        </aside>

        <main id="main-content" class="conversation" tabindex="-1">
          <header class="conversation-header">
            <div class="conversation-header__title">
              <p class="eyebrow">当前会话</p>
              <h1 id="thread-title">新会话</h1>
            </div>

            <div class="conversation-header__actions">
              <output id="run-status" class="run-status" data-state="idle" aria-live="polite">
                <span class="run-status__pulse" aria-hidden="true"></span>
                <span>就绪</span>
              </output>
              <button
                class="icon-button conversation-settings-button"
                type="button"
                aria-label="打开设置"
                data-action="settings"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
                </svg>
              </button>
            </div>
          </header>

          <section
            id="message-list"
            class="message-list"
            role="log"
            aria-label="对话内容"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <div id="empty-state" class="empty-state">
              <div class="empty-state__mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" width="34" height="34">
                  <path d="M13 15.5h22M13 24h14M13 32.5h18" />
                  <circle cx="37" cy="24" r="3" />
                </svg>
              </div>
              <p class="eyebrow">随时可以开始</p>
              <h2>今天想推进什么？</h2>
              <p class="empty-state__intro">
                描述目标、贴一段错误，或者交给我一项完整任务。过程与结果都会保留在这个会话里。
              </p>
              <div class="prompt-grid" aria-label="快捷提示">
                <button class="prompt-chip" type="button" data-prompt="帮我分析当前项目，并提出下一步计划">
                  <span>梳理项目</span>
                  <small>看清现状与下一步</small>
                </button>
                <button class="prompt-chip" type="button" data-prompt="检查当前代码，找出最值得优先修复的问题">
                  <span>检查代码</span>
                  <small>定位高价值问题</small>
                </button>
                <button class="prompt-chip" type="button" data-prompt="把我的想法拆成一份可以执行的计划">
                  <span>拆解目标</span>
                  <small>形成可执行计划</small>
                </button>
              </div>
            </div>
          </section>

          <section
            id="pending-panel"
            class="pending-panel"
            aria-label="待处理请求"
            aria-live="assertive"
            hidden
          ></section>

          <div class="composer-dock">
            <form id="composer-form" class="composer-form">
              <label class="sr-only" for="message-input">发送消息</label>
              <textarea
                id="message-input"
                name="message"
                rows="1"
                maxlength="20000"
                placeholder="告诉 Orchestral 你想完成什么…"
                aria-describedby="composer-hint"
                autocomplete="off"
                autocapitalize="sentences"
                enterkeyhint="send"
                spellcheck="true"
              ></textarea>

              <div class="composer-form__actions">
                <button id="cancel-button" class="cancel-button" type="button" hidden>
                  <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17">
                    <rect x="7" y="7" width="10" height="10" rx="1.5" />
                  </svg>
                  <span>停止</span>
                </button>
                <button id="send-button" class="send-button" type="submit" aria-label="发送消息">
                  <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                    <path d="m5 12 7-7 7 7M12 5v14" />
                  </svg>
                </button>
              </div>
            </form>
            <p id="composer-hint" class="composer-hint">
              <span>Enter 发送 · Shift + Enter 换行</span>
              <span>请核对重要结果</span>
            </p>
          </div>
        </main>
      </div>
    </div>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" class="settings-dialog__surface">
        <header class="settings-dialog__header">
          <div>
            <p class="eyebrow">偏好</p>
            <h2 id="settings-title">设置</h2>
          </div>
          <button class="icon-button" type="submit" value="cancel" aria-label="关闭设置">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </header>
        <div id="settings-content" class="settings-dialog__content"></div>
      </form>
    </dialog>

    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript-notice" role="alert">
        Orchestral 需要 JavaScript 才能连接服务并保存会话。请启用后刷新页面。
      </div>
    </noscript>

    <script type="module" src="./app.js"></script>
  </body>
</html>
