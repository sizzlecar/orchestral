version: 1

app:
  name: orchestral-cli
  environment: development

agent:
  backend: openai
  model_profile: gpt-4o-mini
  stream_buffer: 128
  history_limit: 128
  max_context_tokens: 131072
  reserved_output_tokens: 4096
  compaction:
    enabled: true
    minimum_source_records: 32
    keep_recent_records: 16
    summary_max_chars: 16384

providers:
  default_backend: openai
  default_model: gpt-4o-mini
  backends:
    - name: openai
      kind: openai
      api_key_env: OPENAI_API_KEY
      config:
        timeout_secs: 60
    - name: google
      kind: gemini
      api_key_env: GOOGLE_API_KEY
      config:
        timeout_secs: 60
    - name: openrouter
      kind: openrouter
      endpoint: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      config:
        timeout_secs: 60
    - name: deepseek
      kind: deepseek
      endpoint: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      config:
        timeout_secs: 60
  models:
    - name: gpt-4o-mini
      backend: openai
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 8192
    - name: gemini-2.5-flash
      backend: google
      model: gemini-2.5-flash
      temperature: 0.2
      max_tokens: 8192
    - name: openrouter-auto
      backend: openrouter
      model: openrouter/auto
      temperature: 0.2
      max_tokens: 8192
    - name: deepseek-chat
      backend: deepseek
      model: deepseek-chat
      temperature: 0.2
      max_tokens: 8192

tools:
  max_timeout_ms: 130000
  max_output_bytes: 1048576
  exec:
    enabled: true
    allow_host_execution: true
    network_targets: []

mcp:
  enabled: true
  import_files: []
  servers: []

skills:
  enabled: true
  auto_discover: true
  directories: []

journal:
  backend: filesystem
  root_dir: .orchestral/agent-journal

artifacts:
  backend: filesystem
  root_dir: .orchestral/artifacts
  max_bytes: 67108864
  summary_max_chars: 512

observability:
  log_level: info
  traces_enabled: false
  log_file: logs/orchestral-agent.log
