version: 1

app:
  name: orchestral-cli
  environment: development

agent:
  backend: google
  model_profile: gemini-2.5-flash
  stream_buffer: 128
  max_model_rounds: 8
  max_tool_calls: 32
  max_context_tokens: 131072
  reserved_output_tokens: 4096

providers:
  default_backend: openai
  default_model: gpt-4o-mini
  backends:
    - name: openai
      kind: openai
      api_key_env: OPENAI_API_KEY
    - name: google
      kind: gemini
      api_key_env: GOOGLE_API_KEY
    - name: openrouter
      kind: openrouter
      endpoint: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    - name: deepseek
      kind: deepseek
      endpoint: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
  models:
    - name: gpt-4o-mini
      backend: openai
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 8192
    - name: gemini-2.5-flash
      backend: google
      model: gemini-2.5-flash
      temperature: 0.2
      max_tokens: 8192
    - name: openrouter-auto
      backend: openrouter
      model: openrouter/auto
      temperature: 0.2
      max_tokens: 8192
    - name: deepseek-chat
      backend: deepseek
      model: deepseek-chat
      temperature: 0.2
      max_tokens: 8192

tools:
  max_timeout_ms: 30000
  max_output_bytes: 1048576
  shell:
    enabled: true
    allowed_programs: [git, rg, cargo, rustc, ls, find, sed, head, tail, wc, pwd, mkdir, cp, mv]

mcp:
  enabled: true
  servers: []

skills:
  enabled: true
  auto_discover: true
  max_active_skills: 3
  directories: []
  trust_workspace: false
  allow_incompatible: false

journal:
  backend: filesystem
  root_dir: .orchestral/agent-journal

artifacts:
  backend: filesystem
  root_dir: .orchestral/artifacts
  max_bytes: 67108864
  summary_max_chars: 512

observability:
  log_level: info
  traces_enabled: false
